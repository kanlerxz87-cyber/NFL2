name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Confirm the artifact root is the audited dashboard, not the docs/ archive
        run: |
          echo "Canonical pages that must be present at the artifact root:"
          for f in index.html line-origination.html depth-impact.html flagged-for-review.html \
                   requirements.html validation-gates.html skill-vs-luck.html bet-types.html; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing from the repository root; refusing to publish"
              exit 1
            fi
          done
          if [ ! -f docs/index.html ]; then
            echo "::warning::docs/ archive is absent; the /NFL2/docs/ URL documented in README.md will 404"
          fi
          echo "artifact root looks like the canonical dashboard"
      # Deploy the repository root: the canonical dashboard generated by tools/build_site.py and
      # gated in CI by tools/verify.py + tools/check_site.py.
      #
      # This previously uploaded "docs", which is session arena-009ec582's older 16-page archived
      # build. That Actions artifact won the race against the legacy Pages build (build_type
      # legacy, source main, path /), so the live site published the archive while all 22
      # canonical pages returned 404 -- including line-origination.html, depth-impact.html and
      # correlation.html. Verified live on 2026-11-12: GET /defense.html (docs-only) returned 200
      # while GET /line-origination.html (root-only) returned 404. Recorded as FL-26.
      #
      # docs/ is NOT deleted. It stays in the repository and remains reachable at
      # https://kanlerxz87-cyber.github.io/NFL2/docs/index.html, as README.md documents.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
