name: Verify site data and links

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Row-level verification, link check and build reproducibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild site from the single data source
        run: python3 tools/build_site.py
      - name: Confirm generated output matches the committed output
        run: git diff --exit-code
      - name: Verify every row, source, blank cell and internal link
        run: python3 tools/verify.py
