name: build-and-audit
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Rebuild the site from data/ and content/
        run: python tools/build_site.py
      - name: Verify landing-page requirements coverage and source class
        run: python tools/verify_readiness_ac2dd497.py
      - name: Verify the brief-backlog register (gates, official dependencies, replay)
        run: python tools/verify_backlog_58e9c708.py
      - name: Verify the brief coverage matrix, the dated injury read and the freshness panel
        run: python tools/verify_coverage_f34622dd.py
      - name: Audit the data (official sources, reconciliations, no fabricated results)
        run: python tools/verify.py
      - name: Verify the official capture store (hashes, no overwrite, official URLs; session 7c23f22f)
        run: python3 tools/verify_capture_7c23f22f.py
      - name: Fail if the Week 10 injury lineage drifts from its input files (session d8372691)
        run: python3 scripts/injury_lineage_d8372691.py --check
      - name: Audit the site (links, empty cells, template markers, official source coverage)
        run: python tools/check_site.py
      - name: Fail if the published HTML does not match the data it was built from
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "site is in sync with data/ and content/"
          else
            echo "::error::committed HTML differs from a rebuild of the data — commit the output of tools/build_site.py"
            git diff --cached --stat
            exit 1
          fi
